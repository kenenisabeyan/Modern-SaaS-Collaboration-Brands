services:
  - type: web
    name: wabiskills-seminar
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: USE_SQLITE
        value: "true"
      - key: DATABASE_URL
        value: sqlite://./database.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 24h
      - key: PUBLIC_APP_URL
        value: https://covideo.vercel.app
      - key: CORS_ORIGIN
        value: https://covideo.vercel.app,https://*.vercel.app,https://*.onrender.com
